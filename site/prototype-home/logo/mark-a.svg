<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="D-Tox">
  <defs>
    <linearGradient id="face1" x1="24" y1="14" x2="96" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6FFF4"/><stop offset=".35" stop-color="#7CF0C4"/><stop offset=".8" stop-color="#22C79A"/><stop offset="1" stop-color="#119C82"/>
    </linearGradient>
    <linearGradient id="face2" x1="104" y1="70" x2="28" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FD9B0"/><stop offset=".55" stop-color="#139A86"/><stop offset="1" stop-color="#0B6B63"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A5A52"/><stop offset="1" stop-color="#04302C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="24" y1="14" x2="70" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hl"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="c1"><path d="M29 20 L106 60 L80 60 L54 47 L54 84 L29 97 Z"/></clipPath>
    <filter id="soft" x="-40%" y="-200%" width="180%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="66" cy="118" rx="38" ry="4" fill="#000" opacity=".45" filter="url(#soft)"/>
  <g stroke-linejoin="round" stroke-width="7">
    <!-- thickness: the same pieces, lower and darker -->
    <g transform="translate(0 5)" fill="url(#side)" stroke="url(#side)">
      <path d="M86 75 L106 75 L33 110 L33 103 L56 92 Z"/>
      <path d="M29 20 L106 60 L80 60 L54 47 L54 84 L29 97 Z"/>
    </g>
    <!-- bottom piece -->
    <path d="M86 75 L106 75 L33 110 L33 103 L56 92 Z" fill="url(#face2)" stroke="url(#face2)"/>
    <!-- stem + top arm, one folded piece -->
    <path d="M29 20 L106 60 L80 60 L54 47 L54 84 L29 97 Z" fill="url(#face1)" stroke="url(#face1)"/>
  </g>
  <!-- top light -->
  <ellipse cx="34" cy="34" rx="26" ry="34" fill="url(#hl)" clip-path="url(#c1)"/>
  <path d="M27 19.5 L104 59.5" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
</svg>
