<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D-Tox</title>
    <link rel="stylesheet" href="popup-style.css" />
  </head>
  <body>
    <!-- The popup (#23); popup.ts fills it from settings.json. -->
    <header class="hero">
      <div class="hd">
        <h1 class="brand"><img src="icon-48.png" alt="" width="30" height="30" /><span>D-Tox<small>for YouTube</small></span></h1>
        <input type="checkbox" role="switch" class="sw big" id="enabled" aria-label="D-Tox is on" disabled />
      </div>
      <p id="status" aria-live="polite"></p>
      <div class="ticks" aria-hidden="true"></div>
    </header>
    <main>
      <div class="tabs" role="tablist" aria-label="Settings"><span class="pill" aria-hidden="true"></span></div>
      <div id="panels"></div>
    </main>
    <footer class="ft">
      <a href="https://d-tox.saaquiblabs.com/privacy" target="_blank">Privacy</a>
      <a href="https://d-tox.saaquiblabs.com/changelog" target="_blank">What’s new</a>
      <a href="https://github.com/sponsors/saaquiblabs" target="_blank" class="heart">Sponsor</a>
      <span id="version"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
