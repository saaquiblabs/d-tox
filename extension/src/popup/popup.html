<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D-Tox</title>
    <link rel="stylesheet" href="popup-style.css" />
  </head>
  <body>
    <!-- The popup (#23); popup.ts fills it from settings.json. -->
    <header class="hero">
      <div class="hd">
        <h1 class="brand"><img src="icon-48.png" alt="" width="30" height="30" />D-Tox</h1>
        <input type="checkbox" role="switch" class="sw big" id="enabled" aria-label="D-Tox is on" disabled />
      </div>
      <p id="status" aria-live="polite"></p>
      <div class="ticks" aria-hidden="true"></div>
    </header>
    <main>
      <div class="bar">
        <div class="tabs" role="tablist" aria-label="Settings"><span class="pill" aria-hidden="true"></span></div>
        <input type="search" id="find" aria-label="Find a switch" placeholder="Find a switch" autocomplete="off" spellcheck="false" hidden />
        <button type="button" class="seek" aria-label="Find a switch" aria-keyshortcuts="/" aria-controls="find" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" /><path d="m20 20-5-5" /></svg>
        </button>
      </div>
      <div id="panels"><p class="none" hidden>Nothing matches</p></div>
    </main>
    <footer class="ft">
      <a href="https://d-tox.saaquiblabs.com/privacy" target="_blank">Privacy</a>
      <a href="https://d-tox.saaquiblabs.com/changelog" target="_blank">What’s new</a>
      <a href="https://github.com/sponsors/saaquiblabs" target="_blank" class="heart">Sponsor</a>
      <span id="version"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
